name: CI

# Synthetic tests and release-bundle smoke checks on Windows, macOS and Linux, plus
# lightweight runs in Debian, Ubuntu, Fedora and Alpine userspaces.
# Nothing is published: no release, tag, package upload or secret is used. The uv check
# installs uv from PyPI and builds the package with setuptools from PyPI.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Installed first so that the tested interpreter below stays the default on PATH.
      - name: Set up Python 3.10 (must be refused)
        id: old
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Unit and synthetic tests
        timeout-minutes: 8
        run: python -B -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Build both release archives
        timeout-minutes: 3
        run: |
          out="$(python -B tools/build_bundle.py --out "$RUNNER_TEMP/dist")"
          echo "$out"
          echo "PAI_TGZ=$(printf '%s\n' "$out" | sed -n 2p)" >> "$GITHUB_ENV"
          echo "PAI_ZIP=$(printf '%s\n' "$out" | sed -n 4p)" >> "$GITHUB_ENV"

      - name: Rebuild is byte-identical
        timeout-minutes: 3
        run: |
          python -B tools/build_bundle.py --out "$RUNNER_TEMP/dist2" > /dev/null
          for f in "$PAI_TGZ" "$PAI_ZIP"; do
            cmp "$f" "$RUNNER_TEMP/dist2/$(basename "$f")"
          done

      - name: Downloaded-bundle smoke (this platform's format first)
        timeout-minutes: 8
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then first="$PAI_ZIP"; second="$PAI_TGZ"; else first="$PAI_TGZ"; second="$PAI_ZIP"; fi
          python -B tools/bundle_smoke.py "$first" "$second" --work "$RUNNER_TEMP/smoke work" --keep
          bundle="$(ls -d "$RUNNER_TEMP/smoke work/location-one"/pai-workbench-*)"
          if [ "$RUNNER_OS" = "Windows" ]; then bundle="$(cygpath -w "$bundle")"; fi
          echo "PAI_BUNDLE=$bundle" >> "$GITHUB_ENV"

      - name: Real Python 3.10 is refused (POSIX launcher)
        if: runner.os != 'Windows'
        timeout-minutes: 2
        env:
          PAI_PYTHON: ${{ steps.old.outputs.python-path }}
        run: |
          set +e
          "$PAI_BUNDLE/bin/pai" --version 2> "$RUNNER_TEMP/err.txt"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/err.txt"
          test "$rc" = 2
          grep -q "3.11 or newer is required; this is 3.10" "$RUNNER_TEMP/err.txt"

      - name: Windows launcher from cmd.exe in an unrelated directory
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: cmd
        env:
          OLD_PYTHON: ${{ steps.old.outputs.python-path }}
        run: |
          cd /d "%RUNNER_TEMP%"
          set "PAI_PYTHON="
          set "PAI_CONFIG="
          call "%PAI_BUNDLE%\bin\pai.cmd" --version || exit /b 1
          rem Smoke already initialized this bundle; its default configuration must pass.
          call "%PAI_BUNDLE%\bin\pai.cmd" doctor
          if not "%ERRORLEVEL%"=="0" exit /b 1
          set "PAI_MISSING_CONFIG=%RUNNER_TEMP%\pai-missing-cmd-%RANDOM%-%RANDOM%.toml"
          if exist "%PAI_MISSING_CONFIG%" exit /b 1
          call "%PAI_BUNDLE%\bin\pai.cmd" --config "%PAI_MISSING_CONFIG%" doctor
          if not "%ERRORLEVEL%"=="1" exit /b 1
          set "PAI_PYTHON=%OLD_PYTHON%"
          call "%PAI_BUNDLE%\bin\pai.cmd" --version 2> "%RUNNER_TEMP%\old.txt"
          if not "%ERRORLEVEL%"=="2" exit /b 1
          type "%RUNNER_TEMP%\old.txt"
          findstr /c:"3.11 or newer is required; this is 3.10" "%RUNNER_TEMP%\old.txt" || exit /b 1

      - name: Windows launcher from PowerShell in an unrelated directory
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        env:
          OLD_PYTHON: ${{ steps.old.outputs.python-path }}
        run: |
          Set-Location $env:RUNNER_TEMP
          Remove-Item Env:PAI_PYTHON -ErrorAction SilentlyContinue
          Remove-Item Env:PAI_CONFIG -ErrorAction SilentlyContinue
          & "$env:PAI_BUNDLE\bin\pai.cmd" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Smoke already initialized this bundle; its default configuration must pass.
          & "$env:PAI_BUNDLE\bin\pai.cmd" doctor --agents
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $missingConfig = Join-Path $env:RUNNER_TEMP ("pai-missing-pwsh-" + [guid]::NewGuid().ToString("N") + ".toml")
          if (Test-Path -LiteralPath $missingConfig) { exit 1 }
          & "$env:PAI_BUNDLE\bin\pai.cmd" --config $missingConfig doctor
          if ($LASTEXITCODE -ne 1) { exit 1 }
          python "$env:PAI_BUNDLE\bin\pai.py" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:PAI_PYTHON = $env:OLD_PYTHON
          & "$env:PAI_BUNDLE\bin\pai.cmd" --version
          if ($LASTEXITCODE -ne 2) { exit 1 }
          exit 0

      # The installable package (pyproject.toml): build a wheel from this checkout and install it
      # the way `uv tool install git+https://...@vX.Y.Z` does, into temporary folders.
      - name: Package installed with uv tool install
        timeout-minutes: 6
        run: |
          python -m pip install --quiet "uv==0.13.9"
          export UV_TOOL_DIR="$RUNNER_TEMP/uv tools" UV_TOOL_BIN_DIR="$RUNNER_TEMP/uv-bin" UV_PYTHON_DOWNLOADS=never
          python -m uv build --wheel --out-dir "$RUNNER_TEMP/wheel" .
          python -m uv tool install --python "$(python -c 'import sys; print(sys.executable)')" "$RUNNER_TEMP"/wheel/pai_workbench-*.whl
          if [ "$RUNNER_OS" = "Windows" ]; then pai="$(cygpath -u "$UV_TOOL_BIN_DIR")/pai"; else pai="$UV_TOOL_BIN_DIR/pai"; fi
          want="pai $(python -B -c 'import pai; print(pai.__version__)')"
          test "$("$pai" --version)" = "$want"
          set +e
          "$pai" install 2> "$RUNNER_TEMP/install.txt"; rc=$?
          "$pai" doctor --agents > "$RUNNER_TEMP/doctor.txt"
          "$pai" > "$RUNNER_TEMP/bare.txt"; bare=$?
          "$pai" run --help > "$RUNNER_TEMP/run.txt" 2>&1; run=$?
          set -e
          cat "$RUNNER_TEMP/install.txt" "$RUNNER_TEMP/doctor.txt" "$RUNNER_TEMP/bare.txt" "$RUNNER_TEMP/run.txt"
          test "$rc" = 2
          grep -q "installed Python package" "$RUNNER_TEMP/install.txt"
          grep -q "package pai-workbench .* intact: .* match its RECORD" "$RUNNER_TEMP/doctor.txt"
          test "$bare" = 0
          if [ "$RUNNER_OS" = "Windows" ]; then
            # native Windows: PAI's own commands only; the workbench points to WSL
            grep -q "WSL" "$RUNNER_TEMP/bare.txt"
            test "$run" = 2
            grep -q "WSL" "$RUNNER_TEMP/run.txt"
          else
            # the workbench modules load from inside the package (pai/_workbench)
            grep -q "pai run --dry-run" "$RUNNER_TEMP/bare.txt"
            grep -q "_workbench/WORKBENCH.md" "$RUNNER_TEMP/bare.txt"
            test "$run" = 0
            grep -q -- "--dry-run" "$RUNNER_TEMP/run.txt"
          fi

      - name: Upload smoke report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/smoke work/smoke-results.json
          if-no-files-found: ignore
          retention-days: 5

  userspace:
    # Lightweight checks in other Linux userspaces, with each image's own python3. Containers run
    # through docker directly because JavaScript actions do not run inside Alpine (musl).
    name: userspace / ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:stable-slim
            setup: apt-get update -qq && apt-get install -y -qq python3 > /dev/null
          - image: ubuntu:24.04
            setup: apt-get update -qq && apt-get install -y -qq python3 > /dev/null
          - image: fedora:latest
            setup: dnf -y -q install python3 > /dev/null
          - image: alpine:latest
            setup: apk add --no-cache -q python3
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Tests, build and bundle smoke as an unprivileged user
        timeout-minutes: 12
        env:
          IMAGE: ${{ matrix.image }}
          SETUP: ${{ matrix.setup }}
        run: docker run --rm -v "$PWD:/src:ro" -e SETUP "$IMAGE" sh /src/tools/ci_userspace.sh
